name: Mesa de Operações - build
on:
  push:
    branches: [mesa-operacoes-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify initial agent roster and persistence
        run: pnpm exec tsx --test scripts/mesa-seed.test.ts
      - name: Install browser for visual smoke test
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test built application and live API
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          export HOST=127.0.0.1 PORT=18790
          export DB_PATH="$runtime_dir/mesa.sqlite" LOGS_DIR="$runtime_dir/logs"
          export API_AUTH_TOKEN="$(openssl rand -hex 32)"
          export OAUTH_ENCRYPTION_SECRET="$(openssl rand -hex 32)"
          pnpm exec tsx server/index.ts > "$runtime_dir/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$runtime_dir/server.log"; rm -rf "$runtime_dir"' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18790/api/health > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18790/api/health
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          const base = "http://127.0.0.1:18790";
          const headers = { authorization: "Bearer " + process.env.API_AUTH_TOKEN };
          const read = async (path) => {
            const response = await fetch(base + path, { headers });
            assert.equal(response.status, 200, path);
            return response.json();
          };
          const page = await fetch(base);
          assert.equal(page.status, 200);
          assert.match(await page.text(), /<html/i);
          const { agents } = await read("/api/agents");
          assert.equal(agents.length, 8);
          assert.deepEqual(agents.map(a => a.name).sort(), Array.from({ length: 8 }, (_, i) => "Agente " + String(i + 1).padStart(2, "0")));
          const { tasks } = await read("/api/tasks");
          assert.equal(tasks.length, 0);
          console.log("Live API smoke test passed: 8 agents, 0 tasks, frontend served.");
          JS
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true, args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader"] });
          async function assertScenePixels(page) {
            const image = await page.locator('[data-office-ready="true"] canvas').screenshot();
            const colors = await page.evaluate(async (base64) => {
              const img = new Image();
              img.src = "data:image/png;base64," + base64;
              await img.decode();
              const canvas = document.createElement("canvas");
              canvas.width = 100;
              canvas.height = 100;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, 100, 100);
              const rgba = ctx.getImageData(0, 0, 100, 100).data;
              const colors = new Set();
              for (let i = 0; i < rgba.length; i += 4) colors.add([rgba[i] >> 3, rgba[i+1] >> 3, rgba[i+2] >> 3].join(","));
              return colors.size;
            }, image.toString("base64"));
            assert.ok(colors >= 20, "Office canvas appears blank or incomplete: " + colors + " colors");
            console.log("Office canvas verified: " + colors + " distinct quantized colors.");
          }
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, locale: "en-US" });
            page.on("pageerror", error => console.error("Browser exception:", error.message));
            await page.goto("http://127.0.0.1:18790", { waitUntil: "domcontentloaded" });
            await page.screenshot({ path: "/tmp/mesa-initial.png", fullPage: true });
            await page.getByRole("heading", { name: "Mesa de Operações", exact: true }).waitFor({ timeout: 30000 });
            await page.locator('[data-office-ready="true"]').waitFor({ state: "visible", timeout: 45000 });
            await assertScenePixels(page);
            await page.screenshot({ path: "/tmp/mesa-office.png", fullPage: true });
            await page.getByRole("button", { name: "Indicadores", exact: false }).first().click();
            await page.getByRole("heading", { name: "Central de monitoramento" }).waitFor({ timeout: 15000 });
            const stations = page.getByRole("article");
            await stations.last().waitFor();
            assert.equal(await stations.count(), 8);
            for (let i = 1; i <= 8; i++) {
              const station = stations.filter({ hasText: "Agente " + String(i).padStart(2, "0") });
              assert.equal(await station.count(), 1);
              assert.match(await station.innerText(), /Não configurado/);
            }
            await page.screenshot({ path: "/tmp/mesa-monitor.png", fullPage: true });
            await stations.first().getByRole("button", { name: "Abrir agente" }).click();
            await page.screenshot({ path: "/tmp/mesa-agent.png", fullPage: true });
            await page.getByLabel("Instruções individuais").waitFor();
            assert.equal(await page.getByLabel("Instruções individuais").inputValue(), "");
            await page.context().close();
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            await mobile.goto("http://127.0.0.1:18790", { waitUntil: "domcontentloaded", timeout: 90000 });
            await mobile.getByRole("heading", { name: "Mesa de Operações", exact: true }).waitFor({ timeout: 30000 });
            await mobile.locator('[data-office-ready="true"]').waitFor({ state: "visible", timeout: 45000 });
            await assertScenePixels(mobile);
            await mobile.screenshot({ path: "/tmp/mesa-mobile.png", fullPage: true });
            assert.equal(await mobile.evaluate(() => document.documentElement.scrollWidth <= window.innerWidth), true, "mobile page must not overflow horizontally");
            console.log("Browser smoke passed: canvas, eight stations, individual detail, mobile layout.");
          } finally {
            await browser.close();
          }
          JS
      - name: Produce formatting patch for review
        if: always()
        shell: bash
        run: |
          pnpm exec prettier --write .github/workflows/mesa-build.yml compose.mesa.yml scripts/mesa-seed.test.ts server/modules/bootstrap/schema/seeds.ts src/app/AppMainLayout.tsx src/components/agent-detail/AgentDetailTabContent.tsx src/components/AgentDetail.tsx src/components/office-view/buildScene-departments.ts src/components/office-view/buildScene.ts src/components/office-view/drawing-furniture-a.ts src/components/OperationsMonitor.tsx src/components/Sidebar.tsx
          git diff --binary > /tmp/mesa-format.patch
          git diff --stat
          echo MESA_PATCH_BEGIN
          cat /tmp/mesa-format.patch
          echo MESA_PATCH_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-format-patch
          path: /tmp/mesa-format.patch
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-browser-screenshots
          path: |
            /tmp/mesa-office.png
            /tmp/mesa-monitor.png
            /tmp/mesa-initial.png
            /tmp/mesa-agent.png
            /tmp/mesa-mobile.png
          if-no-files-found: warn
