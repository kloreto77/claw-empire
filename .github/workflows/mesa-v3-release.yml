name: Mesa 3.0.0 - release e atualização pública
on:
  push:
    branches: [mesa-v3-release-3.0.0]
    paths:
      - .github/workflows/mesa-v3-release.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mesa-release-3.0.0
  cancel-in-progress: false
env:
  PREVIEW_RUN: "45736908610"
  SOURCE_SHA: "ff07e3084168d84648fe8cf527b73a7bced1e201"
  RELEASE_VERSION: "3.0.0"
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require exact successful Windows and visual validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$PREVIEW_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIEW_RUN" | jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .head_branch == "mesa-operacoes-v3" and .conclusion == "success"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIEW_RUN/jobs" | jq -e '[.jobs[] | select(.name == "validate" or .name == "package") | .conclusion] == ["success","success"]'
      - uses: actions/download-artifact@v4
        with:
          name: Mesa-V3-Preview-Windows-x64
          path: desktop-release
          github-token: ${{ github.token }}
          run-id: 45736908610
      - name: Publish only the previously validated installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe="desktop-release/Mesa-V2-Setup-$RELEASE_VERSION-x64.exe"
          test -s "$exe"
          test -s "$exe.blockmap"
          test -s desktop-release/app-asar.sha256
          grep -Fx "version: $RELEASE_VERSION" desktop-release/latest.yml
          expected="$(sed -n 's/^sha512: //p' desktop-release/latest.yml | tr -d '\r')"
          actual="$(openssl dgst -sha512 -binary "$exe" | openssl base64 -A)"
          test -n "$expected" && test "$expected" = "$actual"
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" "$exe" "$exe.blockmap" desktop-release/latest.yml --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --latest --title "Mesa de Operações 3.0.0" --notes "Windows x64. Validação de compilação, testes automatizados, interface e instalação local aprovada. Mercado exclusivamente simulado. Verificação do atualizador público executada em job separado. Instalador experimental sem assinatura."
  verify-public-update:
    needs: publish
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: Mesa-V3-Preview-Windows-x64
          path: desktop-release
          github-token: ${{ github.token }}
          run-id: 45736908610
      - name: Verify public upgrade from installed 2.0.9 to 3.0.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Get-Content './desktop/test-public-update.ps1' -Raw
          $script = $script.Replace('2.0.8','2.0.9').Replace('2\.0\.8','2\.0\.9')
          $path = Join-Path $PWD 'desktop/test-public-update-209.ps1'
          [IO.File]::WriteAllText($path,$script)
          & $path
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mesa-V3-public-update-diagnostics
          path: desktop-public-diagnostics/
          if-no-files-found: ignore
