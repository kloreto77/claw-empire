name: Mesa V2 - Windows desktop
on:
  push:
    branches: [mesa-operacoes-v2]
    paths:
      - "desktop/**"
      - "server/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mesa-windows.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a tested desktop version to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  package:
    runs-on: windows-2025
    timeout-minutes: 65
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - run: pnpm build
      - run: pnpm exec tsx --test scripts/mesa-seed.test.ts
      - name: Stage local runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD '.desktop-runtime'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($dir in @('server','dist','node_modules','scripts','public','docs','templates','tools','slides')) {
            if (Test-Path $dir) {
              robocopy $dir (Join-Path $stage $dir) /E /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
              if ($LASTEXITCODE -ge 8) { throw "Copy failed: $dir" }
              $global:LASTEXITCODE = 0
            }
          }
          Copy-Item package.json $stage
          Copy-Item tsconfig*.json $stage
          Copy-Item desktop/backend.mjs (Join-Path $stage 'desktop-backend.mjs')
          Copy-Item (Get-Command node.exe).Source (Join-Path $stage 'node.exe')
          if (!(Test-Path (Join-Path $stage 'node_modules/tsx/dist/loader.mjs'))) { throw 'Missing tsx loader' }
      - name: Install desktop build tools
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Format desktop sources
        run: pnpm exec prettier --check desktop/main.cjs desktop/backend.mjs desktop/after-pack.cjs desktop/package.json .github/workflows/mesa-windows.yml
      - name: Show exact desktop formatting differences
        if: failure()
        run: |
          pnpm exec prettier --write desktop/main.cjs
          git diff -- desktop/main.cjs
      - name: Package Windows installer
        working-directory: desktop
        run: npx --no-install electron-builder --win nsis --x64 --publish never
      - name: Validate bundled backend runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $PWD 'desktop-release/win-unpacked/resources/mesa-runtime'
          $node = Join-Path $runtime 'node.exe'
          $loader = Join-Path $runtime 'node_modules/tsx/dist/loader.mjs'
          if (!(Test-Path $loader)) { throw "Packaged TSX loader missing: $loader" }
          & $node --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Node failed' }
          $loaderUri = ([uri]$loader).AbsoluteUri
          Push-Location $runtime
          try {
            & $node --import $loaderUri -e "require('node:sqlite'); require('express'); require('ws'); require('esbuild').transformSync('const n: number = 1', {loader: 'ts'}); console.log('Bundled SQLite, tsx and dependencies OK')"
          } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Node/tsx/SQLite failed' }
      - name: Launch packaged desktop smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'desktop-release/win-unpacked/MesaOperacoesV2.exe'
          if (!(Test-Path $exe)) { throw 'Packaged executable missing' }
          $diag = Join-Path $PWD 'desktop-diagnostics'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          $env:MESA_SMOKE_DIR = $diag
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $p = Start-Process -FilePath $exe -ArgumentList '--mesa-smoke-test','--enable-logging=stderr' -PassThru -RedirectStandardOutput (Join-Path $diag 'stdout.log') -RedirectStandardError (Join-Path $diag 'stderr.log')
          try {
            if (!$p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Desktop startup timed out' }
            if ($p.ExitCode -ne 0) { throw "Desktop smoke failed: $($p.ExitCode)" }
            if (!(Test-Path (Join-Path $diag 'smoke-runtime/logs/desktop-main.log'))) { throw 'Missing smoke log' }
            if (!(Select-String -Path (Join-Path $diag 'smoke-runtime/logs/desktop-main.log') -Pattern 'Smoke test passed.' -SimpleMatch)) { throw 'Missing smoke success marker' }
          } finally {
            Get-ChildItem $diag -Filter '*.log' -Recurse | ForEach-Object {
              Write-Host "=== $($_.Name) ==="
              Get-Content $_.FullName -Tail 100
            }
          }
      - name: Verify update metadata exists
        shell: pwsh
        run: |
          if (!(Test-Path 'desktop-release/latest.yml')) { throw 'Missing updater metadata' }
          Get-Content 'desktop-release/latest.yml'
      - name: Build earlier version for update test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = 'desktop/package.json'
          $original = Get-Content $pkg -Raw
          try {
            node -e "const fs=require('fs'); const p='desktop/package.json'; const v=JSON.parse(fs.readFileSync(p)); v.version='2.0.0'; fs.writeFileSync(p,JSON.stringify(v,null,2))"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare update fixture' }
            Push-Location desktop
            try {
              npx --no-install electron-builder --win nsis --x64 --publish never --config.directories.output=../desktop-update-fixture
              if ($LASTEXITCODE -ne 0) { throw 'Fixture packaging failed' }
            } finally { Pop-Location }
          } finally {
            [IO.File]::WriteAllText((Join-Path $PWD $pkg), $original)
          }
      - name: Test installer and real version upgrade
        shell: pwsh
        run: ./desktop/test-update.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-V2-Windows-x64
          path: |
            desktop-release/Mesa-V2-Setup-*.exe
            desktop-release/Mesa-V2-Setup-*.exe.blockmap
            desktop-release/latest.yml
          if-no-files-found: error
          retention-days: 30
      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-V2-Windows-diagnostics
          path: |
            desktop-diagnostics/**/*.log
            desktop/package-lock.json
          if-no-files-found: ignore
  publish:
    if: github.ref == 'refs/heads/mesa-operacoes-v2' && (github.event_name == 'push' || inputs.publish_release)
    needs: [quality, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mesa-V2-Windows-x64
          path: desktop-release
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/package.json').version")"
          test -s desktop-release/latest.yml
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Version already released; increment desktop/package.json for another update."
            exit 0
          fi
          gh release create "v$version" desktop-release/Mesa-V2-Setup-*.exe desktop-release/Mesa-V2-Setup-*.exe.blockmap desktop-release/latest.yml --target "$GITHUB_SHA" --title "Mesa V2 Desktop $version" --notes "Windows x64. Build and desktop smoke test passed. Experimental unsigned installer."
