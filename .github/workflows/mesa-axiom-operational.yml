name: AXIOM shadow operational integration
on:
  push:
    branches: [mesa-axiom-operational]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/axiom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/axiom/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
